<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="4" fill="#4F46E5"/>
  
  <!-- Detective face -->
  <circle cx="16" cy="18" r="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  
  <!-- Detective hat -->
  <ellipse cx="16" cy="10" rx="8" ry="3" fill="#1F2937"/>
  <rect x="8" y="10" width="16" height="4" fill="#1F2937"/>
  
  <!-- Eyes -->
  <circle cx="13" cy="16" r="1.5" fill="#1F2937"/>
  <circle cx="19" cy="16" r="1.5" fill="#1F2937"/>
  <circle cx="13.5" cy="15.5" r="0.5" fill="#FFFFFF"/>
  <circle cx="19.5" cy="15.5" r="0.5" fill="#FFFFFF"/>
  
  <!-- Smile -->
  <path d="M 12 20 Q 16 22 20 20" stroke="#1F2937" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Magnifying glass -->
  <circle cx="26" cy="24" r="4" fill="none" stroke="#DC2626" stroke-width="2"/>
  <line x1="28.5" y1="26.5" x2="30" y2="28" stroke="#DC2626" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Emotion in magnifying glass -->
  <text x="26" y="26" font-family="Arial, sans-serif" font-size="3" text-anchor="middle" fill="#DC2626">😊</text>
  
  <!-- Small emotion indicators -->
  <text x="4" y="8" font-family="Arial, sans-serif" font-size="4" fill="#10B981">😀</text>
  <text x="4" y="28" font-family="Arial, sans-serif" font-size="4" fill="#EF4444">😢</text>
</svg>